allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Raise compileSdk for plugin modules that hardcode outdated values
// (e.g. flutter_secure_storage pins 33, while its androidx deps require >= 34).
// Must be registered before evaluationDependsOn(":app") triggers early evaluation.
subprojects { sub ->
    sub.afterEvaluate {
        def androidExt = sub.extensions.findByName("android")
        if (androidExt != null && androidExt.compileSdk instanceof Integer && androidExt.compileSdk < 36) {
            androidExt.compileSdk = 36
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
